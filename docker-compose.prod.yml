services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    # ports:
    #   - "5173:5173"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - VITE_API_URL=${VITE_API_URL:-api:5174}
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # ports:
    #   - "5174:5174"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - TO_EMAIL=${TO_EMAIL:-contact@redmeta.top}
      - FROM_EMAIL=${FROM_EMAIL:-contact@redmeta.top}
      - SERVER_PORT=${SERVER_PORT:-5174}
    restart: unless-stopped
